openapi: 3.0.3
info:
  title: 'Allo Delivery API'
  description: 'API de la plateforme Allo Delivery — gestion des livraisons, profils de livreurs, suivi en temps réel, chat et paiements.'
  version: 1.0.0
servers:
  - url: 'http://localhost:8000'
tags:
  - name: 'Assistant IA'
    description: "\nBrouillons de demandes générés par l'assistant IA. La conversation en mode chat\ntransforme un message libre en données structurées (destinataire, adresses, service, montant)."
  - name: Authentification
    description: "\nEndpoints d'inscription, connexion et gestion de session.\nLes comptes clients sont créés dans le contexte d'un livreur spécifique (via son slug)."
  - name: Avis
    description: "\nSystème de notation et d'avis sur les livraisons terminées.\nUn avis ne peut être laissé qu'une seule fois par demande livrée."
  - name: Chat
    description: "\nMessages de chat entre clients et livreurs pour une demande de livraison.\nLes messages sont diffusés en temps réel via WebSocket (Reverb)."
  - name: 'Dashboard livreur'
    description: "\nTableau de bord du livreur (AR-39). Un seul endpoint retournant des indicateurs agrégés :\ndemandes, missions en cours, chiffre d'affaires, avis et notifications."
  - name: 'Demandes de livraison'
    description: "\nGestion complète des demandes de livraison : création, suivi, transitions de statut,\ngénération de code de confirmation, preuves et validation finale."
  - name: GPS
    description: "\nSuivi de position GPS en temps réel pour les livraisons en cours.\nLes positions sont enregistrées par le livreur pendant le trajet."
  - name: 'Historique des statuts'
    description: "\nHistorique des transitions de statut d'une demande de livraison.\nChaque changement de statut est enregistré avec l'utilisateur, la date et un commentaire."
  - name: Incidents
    description: "\nSignalement d'incidents liés à une demande de livraison (retard, problème, etc.)."
  - name: Notifications
    description: "\nGestion des notifications utilisateur. Les notifications sont générées automatiquement\nlors des événements importants (nouvelle demande, message chat, etc.)."
  - name: Paiements
    description: "\nTransactions de paiement liées aux livraisons (espèces, virement, etc.)."
  - name: Preuves
    description: "\nPreuves de livraison (photos, signatures, tickets).\nLa photo de récupération du colis (pickup_photo) est obligatoire avant le statut \"colis_recupere\"."
  - name: 'Profils livreurs'
    description: "\nGestion des profils de livreurs. Inclut le profil public accessible sans authentification,\nla page publique avec services et zones, ainsi que le CRUD pour les livreurs connectés."
  - name: Services
    description: "\nCRUD des services proposés par un livreur (envoi de colis, documents, courses, etc.).\nChaque service a un nom, une description et un prix de base."
  - name: 'Zones & tarifs'
    description: "\nGestion des zones de livraison et de leurs tarifs fixes.\nChaque zone a un nom, une destination/origine et un prix fixe."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Token Sanctum Bearer. Récupérez-le via `/api/register` ou `/api/login` (champ `token` de la réponse).'
security:
  -
    default: []
paths:
  /api/ai-request-drafts:
    get:
      summary: 'Lister mes brouillons IA'
      operationId: listerMesBrouillonsIA
      description: "Retourne les brouillons de l'utilisateur connecté. Pagination : 20 éléments par page."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Assistant IA'
    post:
      summary: 'Créer un brouillon IA'
      operationId: crerUnBrouillonIA
      description: 'Crée manuellement un brouillon de demande (sans analyse IA).'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Assistant IA'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: null
                  nullable: true
                input_message:
                  type: string
                  description: 'Le message décrivant la demande.'
                  example: 'Envoie un colis à Sara'
                generated_data:
                  type: string
                  description: 'Must be a valid JSON string.'
                  example: '["architecto","architecto"]'
                  nullable: true
                status:
                  type: string
                  description: 'Le statut du brouillon.'
                  example: pending
                  nullable: true
                error_message:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                validated_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-08-11T00:00:49'
                  nullable: true
              required:
                - input_message
  '/api/ai-request-drafts/{id}':
    get:
      summary: "Détail d'un brouillon IA"
      operationId: dtailDunBrouillonIA
      description: "Retourne les détails d'un brouillon spécifique, y compris les données générées par l'IA."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Assistant IA'
    delete:
      summary: 'Supprimer un brouillon IA'
      operationId: supprimerUnBrouillonIA
      description: 'Supprime définitivement un brouillon.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Assistant IA'
    parameters:
      -
        in: path
        name: id
        description: "L'identifiant du brouillon."
        example: 1
        required: true
        schema:
          type: integer
  /api/ai-request-drafts/start:
    post:
      summary: 'Démarrer une conversation IA'
      operationId: dmarrerUneConversationIA
      description: "Crée un brouillon vide en mode conversation : le client et l'IA échangent des\nmessages pour compléter le formulaire de demande progressivement."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Assistant IA'
  '/api/ai-request-drafts/{draft}/messages':
    post:
      summary: 'Envoyer un message dans une conversation IA'
      operationId: envoyerUnMessageDansUneConversationIA
      description: "Ajoute le message du client à l'historique et dispatche un job qui génère\nla réponse de l'IA (modèle rapide) puis extrait les données structurées\n(modèle puissant) pour pré-remplir le formulaire de demande."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Assistant IA'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: 'Le message du client.'
                  example: 'Je veux envoyer un colis à Sara'
                driver_slug:
                  type: string
                  description: 'Le slug du livreur.'
                  example: rayan-express
              required:
                - content
                - driver_slug
    parameters:
      -
        in: path
        name: draft
        description: "L'identifiant du brouillon."
        example: 1
        required: true
        schema:
          type: integer
  /api/register:
    post:
      summary: 'Inscrire un livreur'
      operationId: inscrireUnLivreur
      description: 'Crée un nouveau compte livreur avec rôle "driver" forcé côté serveur.'
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'La confirmation du mot de passe ne correspond pas.'
                  errors:
                    password:
                      - 'La confirmation du mot de passe ne correspond pas.'
                properties:
                  message:
                    type: string
                    example: 'La confirmation du mot de passe ne correspond pas.'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'La confirmation du mot de passe ne correspond pas.'
                        items:
                          type: string
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Le nom du livreur.'
                  example: Ahmed
                email:
                  type: string
                  description: "L'adresse email."
                  example: ahmed@example.com
                password:
                  type: string
                  description: 'Le mot de passe (min 8 caractères).'
                  example: secret123
                phone:
                  type: string
                  description: 'Le numéro de téléphone.'
                  example: '+212600000000'
                  nullable: true
              required:
                - name
                - email
                - password
      security: []
  /api/login:
    post:
      summary: 'Connecter un livreur'
      operationId: connecterUnLivreur
      description: 'Authentifie un livreur existant par email et mot de passe.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid credentials'
                  errors: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid credentials'
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "L'adresse email."
                  example: ahmed@example.com
                password:
                  type: string
                  description: 'Le mot de passe.'
                  example: secret123
              required:
                - email
                - password
      security: []
  '/api/drivers/{slug}/login':
    post:
      summary: 'Connecter un client (contexte livreur)'
      operationId: connecterUnClientcontexteLivreur
      description: "Authentifie un client rattaché au livreur du slug.\nUn client du livreur A ne peut pas se connecter via l'URL du livreur B."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid credentials'
                  errors: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid credentials'
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "L'adresse email."
                  example: sara@example.com
                password:
                  type: string
                  description: 'Le mot de passe.'
                  example: secret123
              required:
                - email
                - password
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'Le slug du livreur.'
        example: rayan-express
        required: true
        schema:
          type: string
  /api/logout:
    post:
      summary: Déconnexion
      operationId: dconnexion
      description: "Supprime le token Sanctum courant de l'utilisateur."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentification
  /api/me:
    get:
      summary: 'Profil utilisateur courant'
      operationId: profilUtilisateurCourant
      description: "Retourne les informations de l'utilisateur connecté et son contexte livreur\n(marque, logo) si applicable."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentification
  /api/reviews:
    get:
      summary: 'Lister mes avis'
      operationId: listerMesAvis
      description: "Retourne les avis laissés par l'utilisateur connecté."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Avis
    post:
      summary: 'Laisser un avis'
      operationId: laisserUnAvis
      description: 'Crée un avis sur une demande livrée. Un seul avis par demande et par utilisateur.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Avis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_request_id:
                  type: integer
                  description: "L'ID de la demande livrée."
                  example: 1
                rating:
                  type: integer
                  description: 'Note de 1 à 5.'
                  example: 4
                comment:
                  type: string
                  description: 'Commentaire optionnel.'
                  example: 'Très bon service, rapide et efficace'
                  nullable: true
              required:
                - delivery_request_id
                - rating
  '/api/reviews/{id}':
    get:
      summary: "Détail d'un avis"
      operationId: dtailDunAvis
      description: "Retourne les détails d'un avis spécifique."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Avis
    put:
      summary: 'Modifier un avis'
      operationId: modifierUnAvis
      description: "Met à jour le commentaire ou la note d'un avis existant."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Avis
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  description: 'La nouvelle note.'
                  example: 5
                comment:
                  type: string
                  description: 'Le nouveau commentaire.'
                  example: 'Service excellent'
                  nullable: true
    delete:
      summary: 'Supprimer un avis'
      operationId: supprimerUnAvis
      description: 'Supprime définitivement un avis.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Avis
    parameters:
      -
        in: path
        name: id
        description: "L'identifiant de l'avis."
        example: 1
        required: true
        schema:
          type: integer
  /api/chat-messages:
    get:
      summary: 'Lister les messages'
      operationId: listerLesMessages
      description: "Retourne les messages d'une demande spécifique ou tous les messages de l'utilisateur.\nPagination : 20 éléments par page."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Chat
    post:
      summary: 'Envoyer un message'
      operationId: envoyerUnMessage
      description: "Envoie un message dans le chat d'une demande de livraison.\nLe message est diffusé en temps réel aux participants."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_request_id:
                  type: integer
                  description: "L'ID de la demande."
                  example: 1
                message_type:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
                  nullable: true
                content:
                  type: string
                  description: 'Le contenu du message.'
                  example: "Bonjour, j'arrive dans 10 min"
                is_read:
                  type: boolean
                  description: ''
                  example: true
              required:
                - delivery_request_id
                - content
  '/api/chat-messages/{id}':
    get:
      summary: "Détail d'un message"
      operationId: dtailDunMessage
      description: "Retourne les détails d'un message spécifique."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Chat
    put:
      summary: 'Modifier un message'
      operationId: modifierUnMessage
      description: "Met à jour le contenu d'un message existant."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Chat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message_type:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: b
                  nullable: true
                content:
                  type: string
                  description: 'Le nouveau contenu.'
                  example: 'Message modifié'
                is_read:
                  type: boolean
                  description: ''
                  example: false
    delete:
      summary: 'Supprimer un message'
      operationId: supprimerUnMessage
      description: 'Supprime définitivement un message du chat.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Chat
    parameters:
      -
        in: path
        name: id
        description: "L'identifiant du message."
        example: 1
        required: true
        schema:
          type: integer
  /api/dashboard:
    get:
      summary: 'Tableau de bord du livreur'
      operationId: tableauDeBordDuLivreur
      description: "Retourne les indicateurs du livreur connecté : nombre de demandes,\nmissions actives, en attente, livrées, chiffre d'affaires estimé/encaissé,\nnote moyenne, notifications non lues, les 5 dernières demandes et les 5 derniers messages."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Dashboard livreur'
  '/api/tracking/{privateToken}':
    get:
      summary: "Suivi public d'une demande"
      operationId: suiviPublicDuneDemande
      description: "Affiche les informations de suivi d'une demande via son jeton privé.\nAccessible sans authentification. Inclut l'historique des statuts, les participants,\nle service, la zone, le chat et les preuves de livraison."
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\DeliveryRequest].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\DeliveryRequest].'
      tags:
        - 'Demandes de livraison'
      security: []
    parameters:
      -
        in: path
        name: privateToken
        description: 'Le jeton privé de suivi.'
        example: abc123def456...
        required: true
        schema:
          type: string
  '/api/drivers/{slug}/delivery-requests':
    post:
      summary: 'Créer une demande (via un livreur)'
      operationId: crerUneDemandeviaUnLivreur
      description: "Crée une nouvelle demande de livraison dans le contexte d'un livreur spécifique.\nLe client doit être rattaché au livreur (inscription via `/drivers/{slug}/register`)."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Demandes de livraison'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_id:
                  type: integer
                  description: 'ID du service choisi.'
                  example: 1
                  nullable: true
                delivery_zone_id:
                  type: integer
                  description: 'ID de la zone de livraison.'
                  example: 2
                  nullable: true
                ai_request_draft_id:
                  type: integer
                  description: 'ID du brouillon IA utilisé pour pré-remplir la demande.'
                  example: 5
                  nullable: true
                recipient_name:
                  type: string
                  description: 'Nom du destinataire.'
                  example: Sara
                recipient_phone:
                  type: string
                  description: 'Téléphone du destinataire.'
                  example: '+212600000000'
                pickup_address:
                  type: string
                  description: 'Adresse de retrait.'
                  example: '12 Rue Principale, Agadir'
                delivery_address:
                  type: string
                  description: 'Adresse de livraison.'
                  example: '45 Avenue Hassan II, Agadir'
                package_description:
                  type: string
                  description: 'Description du colis.'
                  example: 'Petit carton 2kg'
                  nullable: true
                product_amount:
                  type: number
                  description: 'Montant du produit à encaisser en DH.'
                  example: 150.0
                  nullable: true
                amount_to_collect:
                  type: number
                  description: 'Montant à encaisser du destinataire en DH.'
                  example: 42.85
                  nullable: true
                scheduled_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-08-11T00:00:48'
                  nullable: true
              required:
                - recipient_name
                - recipient_phone
                - pickup_address
                - delivery_address
    parameters:
      -
        in: path
        name: slug
        description: 'Le slug du livreur.'
        example: rayan-express
        required: true
        schema:
          type: string
  /api/delivery-requests:
    get:
      summary: 'Lister mes demandes'
      operationId: listerMesDemandes
      description: "Retourne les demandes de livraison de l'utilisateur connecté (client ou livreur).\nLes clients voient uniquement leurs propres demandes ; les livreurs voient toutes les demandes qui leur sont assignées.\nPagination : 20 éléments par page."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Demandes de livraison'
  '/api/delivery-requests/{id}':
