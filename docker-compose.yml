# Allo Delivery — stack Docker complète : `docker compose up -d --build`
#
#   Frontend (Vue 3 / Vite) : http://localhost:${FRONTEND_PORT:-5173}
#   API (nginx -> Laravel)  : http://localhost:${API_PORT:-8000}/api
#
# Ports modifiables via un fichier .env à la racine (voir .env.example).
# Services optionnels : `--profile tools` (phpMyAdmin), `--profile realtime` (Reverb).

x-backend: &backend
  build:
    context: ./docker/php
  image: allo-delivery-php
  volumes:
    - ./backend:/var/www/html
  working_dir: /var/www/html
  # Connexion MySQL : backend/.env (copié depuis backend/.env.example au premier
  # démarrage). Pas de DB_* ici : phpunit.xml doit pouvoir imposer SQLite en
  # mémoire aux tests, sinon ils videraient la base de démo.
  environment:
    APP_URL: http://localhost:${API_PORT:-8000}
    # URL publique des fichiers (preuves) : sans elle, asset() reprend l'hôte
    # interne "nginx" vu à travers le proxy Vite, injoignable depuis le navigateur.
    ASSET_URL: http://localhost:${API_PORT:-8000}
    FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
  networks:
    - allo_network

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: allo_delivery
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: allo
      MYSQL_PASSWORD: allo
    ports:
      # Exposé sur 3307 par défaut pour ne pas entrer en conflit avec un MySQL local.
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - allo_network

  # PHP-FPM : initialise le backend au démarrage (docker/php/entrypoint.sh).
  app:
    <<: *backend
    entrypoint: ["allo-entrypoint"]
    command: ["php-fpm"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/allo-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  # Worker de file d'attente (notifications, assistant IA).
  queue:
    <<: *backend
    command: php artisan queue:work database --tries=3 --sleep=3 --timeout=200
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - allo_network

  # Serveur de dev Vite ; /api est relayé vers nginx (pas de CORS).
  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      PROXY_TARGET: http://nginx
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host"
    depends_on:
      - nginx
    networks:
      - allo_network

  # --- Services optionnels ---------------------------------------------------

  # Temps réel (désactivé dans l'application : BROADCAST_CONNECTION=null).
  reverb:
    <<: *backend
    profiles: ["realtime"]
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_USER: allo
      PMA_PASSWORD: allo
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - allo_network

networks:
  allo_network:
    driver: bridge

volumes:
  db_data:
  frontend_node_modules:
